<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SundGuesser — Guess the location in Sundsvall &amp; Medelpad</title>
<meta name="description" content="A free daily geography guessing game set entirely around Sundsvall and Medelpad, Sweden. Look at a real street-level photo, drop your pin on the map, and see how close you get. New rounds every weekday.">
<meta name="theme-color" content="#101d33">
<link rel="canonical" href="https://sundguesser.vaaraniemi.se/">

<!-- Open Graph / Facebook / Slack / Discord link previews.
     Using a small square image + twitter:card=summary (not
     summary_large_image) keeps chat-app embeds (Discord in particular)
     compact — a small thumbnail next to the text instead of a big image
     block that pushes the actual message down. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://sundguesser.vaaraniemi.se/">
<meta property="og:title" content="SundGuesser — Guess the location in Sundsvall &amp; Medelpad">
<meta property="og:description" content="Daily street-view guessing game for Sundsvall &amp; Medelpad.">
<meta property="og:image" content="https://sundguesser.vaaraniemi.se/og-image-square.jpg">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="SundGuesser — Guess the location in Sundsvall &amp; Medelpad">
<meta name="twitter:description" content="Daily street-view guessing game for Sundsvall &amp; Medelpad.">
<meta name="twitter:image" content="https://sundguesser.vaaraniemi.se/og-image-square.jpg">

<!-- Favicon: official coat of arms of the Medelpad landskap (province), by Lokal_Profil
     (Wikimedia Commons, CC BY-SA 2.5) https://commons.wikimedia.org/wiki/File:Medelpad_vapen.svg -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><img src="favicon.svg" alt="" class="header-icon"> SundGuesser</h1>
  <div id="hud">
    <span id="weekdayPin" class="weekday-pin"></span>
    <span id="roundInfo">Round 1 / 5</span>
    <span id="scoreInfo">Score: 0</span>
    <span id="timerInfo" class="timer">⏱ 2:00</span>
    <span id="datePicker">
      <label for="dateSelect">Game:</label>
      <select id="dateSelect"></select>
    </span>
    <button id="viewScoreBtn" class="hidden">👀 View My Score</button>
  </div>
</header>

<main>
  <div id="photoPane">
    <span id="hardRoundBadge" class="hard-round-badge">🔥 Hard Round</span>
    <div id="zoomControls" class="zoom-controls">
      <button id="zoomInBtn" title="Zoom in">➕</button>
      <button id="zoomOutBtn" title="Zoom out">➖</button>
      <button id="zoomResetBtn" title="Reset zoom">⤾</button>
    </div>
    <img id="streetPhoto" src="" alt="Guess this location in Sundsvall">
  </div>
  <div id="mapPane">
    <div id="map"></div>
    <button id="guessBtn" disabled>Make Guess</button>
  </div>
</main>

<div id="startOverlay" class="hidden">
  <div id="startBox">
    <h2 id="startTitle">Ready to play?</h2>
    <p id="startSubtitle">5 rounds, 2 minutes each — the clock starts the moment you press Start.</p>
    <div id="scoreHistory"></div>
    <div id="startActions">
      <button id="startPlayBtn">▶ Start Game</button>
      <button id="startViewScoreBtn" class="hidden">👀 View My Score</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="hidden">
  <div id="resultBox">
    <h2 id="resultTitle"></h2>
    <p id="resultDistance"></p>
    <p id="resultPoints"></p>
    <p id="streakBadge" class="streak-badge hidden"></p>
    <p class="reviewHint">🗺️ Look around the map to see where you were!</p>
    <button id="nextBtn">Next Round</button>
  </div>
</div>

<div id="finalOverlay" class="hidden">
  <div id="finalBox">
    <button id="closeFinalBtn" class="close-btn" title="Close">✕</button>
    <h2>Game Over!</h2>
    <div id="shareCardPreview"></div>
    <p id="finalScore" class="sr-only"></p>
    <ul id="roundBreakdown" class="sr-only"></ul>
    <p id="firstScoreNote" class="shareStatus"></p>
    <div class="shareBtnRow">
      <button id="shareBtn">📋 Share Result</button>
    </div>
    <p id="shareStatus" class="shareStatus"></p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="effects.js"></script>
<script src="script.js"></script>
</body>
</html>
