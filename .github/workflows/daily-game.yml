name: Generate daily game

on:
  schedule:
    # 06:00 UTC, every day (including weekends).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography

      - name: Generate today's game
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: python3 tools/generate_game.py

      - name: Commit and push new game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: publish daily game $(date -u +%Y-%m-%d)"
            git push
          fi
