name: Generate daily game

on:
  schedule:
    # The game's "day" is the UTC calendar date (generate_game.py uses
    # datetime.date.today(), which is UTC on GitHub-hosted runners), so a
    # new day begins at 00:00 UTC. Primary run fires shortly after that.
    - cron: "5 0 * * *"
    # Backup run a few hours later in case the primary was delayed or
    # skipped (GitHub's schedule triggers are best-effort and can lag by
    # hours, especially on low-traffic repos). generate_game.py's backfill
    # logic makes this a safe no-op if the day was already published.
    - cron: "23 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography

      - name: Generate today's game
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: python3 tools/generate_game.py

      - name: Commit and push new game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: publish daily game $(date -u +%Y-%m-%d)"
            git push
          fi
