name: Fetch new locations

on:
  schedule:
    # 02:00 Europe/Stockholm is 00:00 UTC during CEST and 01:00 UTC during
    # CET. Both triggers are needed because GitHub cron has no timezone
    # support; the gate below lets only the run actually occurring at 02:00
    # Stockholm continue.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many new locations to try to add"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check daily schedule and choose random delay/count
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_COUNT: ${{ github.event.inputs.count }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import random
          import time
          from zoneinfo import ZoneInfo

          scheduled = os.environ["EVENT_NAME"] == "schedule"
          now = datetime.datetime.now(ZoneInfo("Europe/Stockholm"))
          if scheduled and now.hour != 2:
              print(
                  f"Not 02:00 Stockholm time (currently {now:%H:%M}); "
                  "skipping this DST-shadow run."
              )
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("SKIP=true\n")
              raise SystemExit

          if scheduled:
              rng = random.SystemRandom()
              delay = rng.randint(60, 1800)
              count = rng.randint(0, 10)
              print(f"Waiting {delay // 60}m {delay % 60}s before fetching.")
              time.sleep(delay)
          else:
              count = int(os.environ.get("MANUAL_COUNT") or "10")

          if count == 0:
              print("Today's random fetch count is 0; skipping.")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("SKIP=true\n")
              raise SystemExit

          print(f"Fetching up to {count} new location(s).")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FETCH_COUNT={count}\n")
          PY

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: pip install cryptography Pillow

      - name: Decrypt current pool
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: python3 tools/decrypt_pool.py

      - name: Fetch new KartaView locations
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: |
          python3 tools/fetch_kartaview_locations.py --count "$FETCH_COUNT"

      - name: Re-encrypt pool
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: python3 tools/build_pool.py

      - name: Commit and push new locations
        if: env.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pool.enc.json
          if git diff --cached --quiet; then
            echo "No new locations found this run."
          else
            git commit -m "chore: auto-fetch new locations from KartaView"
            git push
          fi
