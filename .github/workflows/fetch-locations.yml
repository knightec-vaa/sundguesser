name: Fetch new locations

on:
  workflow_run:
    # Fires right after "Generate daily game" finishes (success or not),
    # instead of its own independent schedule. This removes the race where
    # both workflows could commit/push to data/ around the same time and
    # step on each other. Game generation never waits on this — a stuck or
    # buggy fetch run can't delay or block publishing the day's game.
    workflows: ["Generate daily game"]
    types: [completed]
  workflow_dispatch:
    inputs:
      count:
        description: "How many new locations to try to add"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Only run after a *successful* game generation (per requirements),
    # or when manually triggered.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if already fetched today
        if: github.event_name == 'workflow_run'
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          # Guards against this workflow being triggered more than once in
          # the same UTC day (e.g. a manual dispatch of "Generate daily
          # game" followed later by its scheduled backup run both firing
          # this workflow_run trigger). Fetching is a no-op the second time.
          # Manual workflow_dispatch of *this* workflow always runs, since
          # that's an explicit human request.
          LAST=$(git log -1 --format=%cI --grep="chore: auto-fetch new locations from KartaView" -- data/pool.enc.json)
          LAST_DATE="${LAST:0:10}"
          if [ "$LAST_DATE" = "$TODAY" ]; then
            echo "Already fetched locations today ($TODAY); skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Choose random count
        if: env.SKIP != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_COUNT: ${{ github.event.inputs.count }}
        run: |
          python3 - <<'PY'
          import os
          import random

          if os.environ["EVENT_NAME"] == "workflow_run":
              rng = random.SystemRandom()
              count = rng.randint(5, 20)
          else:
              count = int(os.environ.get("MANUAL_COUNT") or "10")

          if count == 0:
              print("Today's random fetch count is 0; skipping.")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("SKIP=true\n")
              raise SystemExit

          print(f"Fetching up to {count} new location(s).")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FETCH_COUNT={count}\n")
          PY

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: pip install cryptography Pillow

      - name: Decrypt current pool
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: python3 tools/decrypt_pool.py

      - name: Fetch new KartaView locations
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: |
          python3 tools/fetch_kartaview_locations.py --count "$FETCH_COUNT"

      - name: Re-encrypt pool
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: python3 tools/build_pool.py

      - name: Commit and push new locations
        if: env.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pool.enc.json
          if git diff --cached --quiet; then
            echo "No new locations found this run."
          else
            git commit -m "chore: auto-fetch new locations from KartaView"
            git push
          fi
