name: Fetch new locations

on:
  schedule:
    # Fixed UTC schedule every day, safely before game generation. A
    # non-zero minute avoids GitHub Actions' busiest top-of-hour period.
    # This is 00:17 Swedish summer time / 23:17 Swedish winter time.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many new locations to try to add"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Choose random delay/count
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_COUNT: ${{ github.event.inputs.count }}
        run: |
          python3 - <<'PY'
          import os
          import random
          import time

          if os.environ["EVENT_NAME"] == "schedule":
              rng = random.SystemRandom()
              delay = rng.randint(60, 1800)
              count = rng.randint(0, 10)
              print(f"Waiting {delay // 60}m {delay % 60}s before fetching.")
              time.sleep(delay)
          else:
              count = int(os.environ.get("MANUAL_COUNT") or "10")

          if count == 0:
              print("Today's random fetch count is 0; skipping.")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("SKIP=true\n")
              raise SystemExit

          print(f"Fetching up to {count} new location(s).")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FETCH_COUNT={count}\n")
          PY

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: pip install cryptography Pillow

      - name: Decrypt current pool
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: python3 tools/decrypt_pool.py

      - name: Fetch new KartaView locations
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: |
          python3 tools/fetch_kartaview_locations.py --count "$FETCH_COUNT"

      - name: Re-encrypt pool
        if: env.SKIP != 'true'
        env:
          LOCATIONS_KEY: ${{ secrets.SUPERSECRETKEY }}
        run: python3 tools/build_pool.py

      - name: Commit and push new locations
        if: env.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pool.enc.json
          if git diff --cached --quiet; then
            echo "No new locations found this run."
          else
            git commit -m "chore: auto-fetch new locations from KartaView"
            git push
          fi
